<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tracker · Tracker</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/portal.css"></head><body data-page="my-tracker">
<div id="app-header-mount"></div>
<main class="portal-main"><div class="portal-heading"><div><h1>My Tracker</h1><p style="color:var(--gray-500);font-size:.85rem">Read-only view of requests you created or where your name matches the developer, owner, or business approver.</p></div></div>
<section class="portal-grid my-summary" id="my-ticket-summary"></section>
<section class="dashboard-panel"><div class="view-tabs"><button class="view-tab active" data-my-view="ongoing">Ongoing</button><button class="view-tab" data-my-view="closed">Closed</button></div>
<div class="my-tracker-toolbar"><input id="my-search" type="search" placeholder="Search ticket, subject, project, or person" aria-label="Search my tracker"><select id="my-status-filter" aria-label="Filter by status"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>In Review</option><option>Testing</option><option>In Deployment</option><option>Deployed</option><option>Rejected</option></select><select id="my-priority-filter" aria-label="Filter by priority"><option value="">All priorities</option><option>Urgent</option><option>High</option><option>Normal</option><option>Low</option></select><label>Created from <input id="my-from-date" type="date"></label><label>to <input id="my-to-date" type="date"></label><select id="my-sort" aria-label="Sort records"><option value="created-desc">Newest first</option><option value="created-asc">Oldest first</option><option value="sla-asc">SLA due soonest</option><option value="sla-desc">SLA due latest</option><option value="priority-desc">Priority</option></select><select id="my-page-size" aria-label="Rows per page"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></div>
<div class="my-tracker-actions"><div id="my-ticket-count" aria-live="polite"></div><div><button id="my-copy-tickets" class="btn btn-secondary btn-sm" type="button">Copy ticket numbers</button> <button id="my-export" class="btn btn-secondary btn-sm" type="button">Export CSV</button> <button id="my-refresh" class="btn btn-secondary btn-sm" type="button">Refresh</button></div></div><p id="my-copy-status" class="page-note" aria-live="polite"></p><div id="my-ticket-list"></div><div class="my-pagination"><button id="my-prev-page" class="btn btn-secondary btn-sm" type="button">Previous</button><button id="my-next-page" class="btn btn-secondary btn-sm" type="button">Next</button></div></section>
<dialog class="read-only-dialog" id="ticket-dialog"><form method="dialog"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h2 id="ticket-dialog-title">Request details</h2><button class="btn btn-secondary btn-sm">Close</button></div></form><div id="ticket-dialog-content" class="detail-grid"></div></dialog><div id="portal-error" class="page-error" hidden></div></main>
<script src="/assets/header.js" defer></script>
<script src="/assets/portal.js" defer></script></body></html>

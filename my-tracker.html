<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tracker · Tracker</title><link rel="stylesheet" href="/assets/app.css"><style>
.portal-main{max-width:1440px;margin:0 auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}.portal-heading{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.portal-heading h1{font-size:1.35rem}.view-tabs{display:flex;gap:.5rem;border-bottom:1px solid var(--border);margin:1rem 0}.view-tab{background:none;border:0;padding:.7rem 1rem;color:var(--gray-600);font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.view-tab.active{color:var(--primary);border-color:var(--primary)}.report-table{width:100%;border-collapse:collapse;font-size:.84rem}.report-table th,.report-table td{text-align:left;padding:.7rem .5rem;border-bottom:1px solid var(--border);vertical-align:top}.report-table th{color:var(--gray-500);font-weight:600}.ticket-link{border:0;background:none;color:var(--primary);text-decoration:underline;cursor:pointer;font:inherit;font-weight:700}.empty-note{color:var(--gray-500);padding:1rem 0}.read-only-dialog{width:min(720px,calc(100% - 2rem));max-height:80vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow-lg)}.read-only-dialog::backdrop{background:#11182788}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem}.detail-field{padding:.7rem;background:var(--gray-50);border-radius:var(--radius)}.detail-field small{display:block;color:var(--gray-500);margin-bottom:.25rem}.page-error{padding:1rem;color:var(--danger)}
</style></head><body data-page="my-tracker">
<header class="app-header"><div class="header-content"><div class="brand-section"><div class="brand-logo">T</div><nav class="nav-tabs"><a class="nav-tab" href="/">Tracker</a><a class="nav-tab" href="/dashboard.html">Dashboard</a><a class="nav-tab" href="/support.html">Support Desk</a><a class="nav-tab active" href="/my-tracker.html">My Tracker</a></nav></div><div class="user-profile"><div class="user-avatar" id="current-user-avatar">?</div><div class="user-details"><span class="user-name" id="current-user-name">Loading…</span><span class="user-role" id="current-user-role"></span></div><button class="btn btn-secondary btn-sm" onclick="portalLogout()">Logout</button></div></div></header>
<main class="portal-main"><div class="portal-heading"><div><h1>My Tracker</h1><p style="color:var(--gray-500);font-size:.85rem">Read-only view of requests you created or that are assigned to you as developer or owner.</p></div></div>
<section class="dashboard-panel"><div class="view-tabs"><button class="view-tab active" data-my-view="ongoing">Ongoing</button><button class="view-tab" data-my-view="closed">Closed</button></div><div id="my-ticket-count" style="font-size:.82rem;color:var(--gray-500);margin-bottom:.7rem"></div><div id="my-ticket-list"></div></section>
<dialog class="read-only-dialog" id="ticket-dialog"><form method="dialog"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h2 id="ticket-dialog-title">Request details</h2><button class="btn btn-secondary btn-sm">Close</button></div></form><div id="ticket-dialog-content" class="detail-grid"></div></dialog><div id="portal-error" class="page-error" hidden></div></main>
<script src="/assets/portal.js" defer></script></body></html>

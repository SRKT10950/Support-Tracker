<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Tracker · Tracker</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/portal.css"></head><body data-page="my-tracker">
<div id="app-header-mount"></div>
<main class="portal-main"><div class="portal-heading"><div><h1>My Tracker</h1><p style="color:var(--gray-500);font-size:.85rem">Read-only view of requests you created or that are assigned to you as developer or owner.</p></div></div>
<section class="dashboard-panel"><div class="view-tabs"><button class="view-tab active" data-my-view="ongoing">Ongoing</button><button class="view-tab" data-my-view="closed">Closed</button></div><div id="my-ticket-count" style="font-size:.82rem;color:var(--gray-500);margin-bottom:.7rem"></div><div id="my-ticket-list"></div></section>
<dialog class="read-only-dialog" id="ticket-dialog"><form method="dialog"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h2 id="ticket-dialog-title">Request details</h2><button class="btn btn-secondary btn-sm">Close</button></div></form><div id="ticket-dialog-content" class="detail-grid"></div></dialog><div id="portal-error" class="page-error" hidden></div></main>
<script src="/assets/header.js" defer></script>
<script src="/assets/portal.js" defer></script></body></html>

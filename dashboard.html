<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Tracker</title><link rel="stylesheet" href="/assets/app.css"><style>
.portal-main{max-width:1700px;margin:0 auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}.portal-heading{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.portal-heading h1{font-size:1.35rem}.portal-controls{display:flex;gap:.5rem;flex-wrap:wrap}.portal-controls select,.portal-controls input{min-width:130px;padding:.55rem .65rem;border:1px solid var(--border);border-radius:var(--radius);background:white}.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem}.report-table{width:100%;border-collapse:collapse;font-size:.84rem}.report-table th,.report-table td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--border)}.report-table th{color:var(--gray-500);font-weight:600}.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:.65rem;align-items:center;padding:.4rem 0;font-size:.84rem}.bar-track{height:8px;background:var(--gray-100);border-radius:8px;overflow:hidden}.bar-fill{height:100%;background:var(--primary);border-radius:8px}.bar-fill.alt{background:var(--success)}.drill{border:0;background:none;color:var(--primary);text-decoration:underline;cursor:pointer;font:inherit;font-weight:700}.empty-note{color:var(--gray-500);padding:.7rem 0}.user-details{display:flex;flex-direction:column}.page-error{padding:1rem;color:var(--danger)}
</style></head><body data-page="dashboard">
<div id="app-header-mount"></div>
<main class="portal-main"><div class="portal-heading"><div><h1>Delivery dashboard</h1><p style="color:var(--gray-500);font-size:.85rem">Status, throughput, SLA, and developer workload. Click a count to open its tracker records.</p></div><div class="portal-controls"><select id="filter-developer"><option value="">All developers</option></select><select id="filter-period"><option value="year">Yearly</option><option value="month">Monthly</option><option value="day">Daily</option></select><select id="filter-year"></select><select id="filter-month"></select><select id="filter-day"></select><button class="btn btn-secondary btn-sm" onclick="openDeploymentDraft()">Draft deployment email</button></div></div>
<section class="dashboard-panel"><div id="period-label" style="color:var(--gray-500);font-size:.82rem;margin-bottom:.75rem"></div><div id="dashboard-metrics" class="portal-grid"></div></section>
<div class="report-grid"><section class="dashboard-panel"><h2>Status breakdown</h2><div id="status-report"></div></section><section class="dashboard-panel"><h2>Request type mix</h2><div id="type-report"></div></section></div>
<section class="dashboard-panel"><h2>Monthly throughput</h2><div id="throughput-report"></div></section>
<div class="report-grid"><section class="dashboard-panel"><h2>SLA &amp; delivery analysis</h2><div id="sla-report"></div></section><section class="dashboard-panel"><h2>Developer workload</h2><div id="developer-report"></div></section></div>
<section class="dashboard-panel"><h2>Department overview</h2><div id="department-report"></div></section><div id="portal-error" class="page-error" hidden></div></main>
<dialog class="read-only-dialog" id="deployment-dialog" style="width:min(1100px,calc(100% - 2rem))"><form method="dialog"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h2>Draft deployment email</h2><button class="btn btn-secondary btn-sm">Close</button></div></form><label for="deployment-subject" style="font-size:.82rem;font-weight:600">Email subject</label><input id="deployment-subject" class="form-control" style="margin:.35rem 0 1rem" type="text"><p id="deployment-count" style="font-size:.82rem;color:var(--gray-500);margin-bottom:.6rem"></p><div id="deployment-preview" style="max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:1rem;background:#fff;color:#1f2937"></div><div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem"><button class="btn btn-secondary btn-sm" type="button" onclick="copyDeploymentSubject()">Copy subject</button><button class="btn btn-primary btn-sm" type="button" onclick="copyDeploymentBody()">Copy email body</button></div><p id="deployment-copy-status" style="font-size:.78rem;color:var(--success);margin-top:.5rem"></p></dialog>
<script src="/assets/header.js" defer></script>
<script src="/assets/portal.js" defer></script></body></html>

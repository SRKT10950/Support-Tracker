services:
  support-tracker:
    build:
      context: .
      args:
        PORT: ${PORT:-9011}
    ports:
      - "${HOST_PORT:-9011}:${PORT:-9011}"
    environment:
      PORT: ${PORT:-9011}
      DB_API_KEY: ${DB_API_KEY:?Set DB_API_KEY in the deployment environment}
      DB_DEVICE_SECURITY_KEY: ${DB_DEVICE_SECURITY_KEY:?Set DB_DEVICE_SECURITY_KEY in the deployment environment}
      DB_APP_NAME: ${DB_APP_NAME:-Support Tracker}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in the deployment environment}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in the deployment environment}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 24h
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
